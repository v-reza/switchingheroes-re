<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rig Demo</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #12131a;
    --panel: #1b1d27;
    --line: #2b2e3d;
    --ink: #e6e8f0;
    --dim: #8b90a6;
    --accent: #ff6b4a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 13px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: baseline;
    gap: 16px;
    flex-wrap: wrap;
  }
  h1 { font-size: 13px; font-weight: 600; margin: 0; letter-spacing: .02em; }
  #status { color: var(--dim); font-size: 12px; }
  main {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 260px;
    min-height: 0;
  }
  #wrap {
    position: relative;
    display: grid;
    place-items: center;
    background:
      radial-gradient(circle at 50% 40%, #1d2030 0%, #12131a 70%);
    min-height: 0;
    overflow: hidden;
  }
  canvas { display: block; max-width: 100%; max-height: 100%; }
  aside {
    border-left: 1px solid var(--line);
    padding: 14px;
    overflow-y: auto;
    background: var(--panel);
  }
  .label {
    color: var(--dim);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .08em;
    margin: 0 0 8px;
  }
  #anims { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; }
  button {
    font: inherit;
    font-size: 12px;
    background: #242736;
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 5px 9px;
    cursor: pointer;
  }
  button:hover { border-color: #3d4257; }
  button.on {
    background: var(--accent);
    border-color: var(--accent);
    color: #14151c;
    font-weight: 600;
  }
  #info { color: var(--dim); font-size: 11px; margin-bottom: 16px; }
  .row { display: flex; align-items: center; gap: 8px; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  kbd {
    background: #242736;
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 1px 5px;
    font-size: 11px;
  }
  .hint { color: var(--dim); font-size: 11px; margin-top: 18px; line-height: 1.7; }
</style>
</head>
<body>
<header>
  <h1>ChibiWars 103 — baked Spine rig</h1>
  <span id="status">loading…</span>
</header>
<main>
  <div id="wrap">
    <canvas id="stage" width="760" height="900"></canvas>
  </div>
  <aside>
    <p class="label">Animations</p>
    <div id="anims"></div>
    <p class="label">Playback</p>
    <div id="info"></div>
    <div class="row">
      <button id="play">pause</button>
      <input id="speed" type="range" min="0.1" max="2" step="0.1" value="1">
      <span>1.00×</span>
    </div>
    <p class="hint">
      Geometry baked from the original Spine 4.1 skeleton.
      Renderer is plain canvas 2D — no Spine runtime shipped.<br><br>
      <kbd>1</kbd>–<kbd>9</kbd> switch animation<br>
      <kbd>space</kbd> play / pause
    </p>
  </aside>
</main>
<script src="rig.js"></script>
<script>
  // keyboard shortcuts
  addEventListener("keydown", (e) => {
    const btns = [...document.querySelectorAll("#anims button")];
    if (e.key === " ") {
      e.preventDefault();
      document.getElementById("play").click();
    } else if (/^[1-9]$/.test(e.key)) {
      const b = btns[Number(e.key) - 1];
      if (b) b.click();
    }
  });
</script>
</body>
</html>
